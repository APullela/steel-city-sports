<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0e">
  <meta name="description" content="Live scores, stats and playoff brackets for the Penguins, Pirates and Steelers.">
  <title>Steel City Sports</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- full-screen when launched from the iPhone home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Steel City">
  <link rel="preload" href="fonts/big-shoulders.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint so the page doesn't flash.
    try { document.documentElement.dataset.theme = localStorage.getItem('scs:theme') || 'dark'; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <div class="sticky-head">
  <header class="topbar">
    <a class="brand" href="#home" aria-label="Steel City Sports home">
      <!-- an arch bridge: Pittsburgh, the City of Bridges -->
      <svg viewBox="0 0 40 28" aria-hidden="true"><path d="M2 19h36M3 19C9 7 31 7 37 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M9.5 12.4V19M15 10.1V19M20 9.5V19M25 10.1V19M30.5 12.4V19M6 19v6M34 19v6" stroke="currentColor" stroke-width="2"/></svg>
      <span class="wordmark">Steel City<small>Sports</small></span>
    </a>

    <div class="search" role="search">
      <label for="search" class="sr-only">Search players on all three rosters</label>
      <input id="search" type="search" placeholder="Search players" autocomplete="off"
             aria-controls="search-results" aria-expanded="false" aria-autocomplete="list">
      <ul id="search-results" class="search-results" role="listbox" hidden></ul>
    </div>

    <div class="tools">
      <span id="updated" class="updated" aria-live="polite">Loading…</span>
      <button id="refresh" class="icon-btn" type="button" aria-label="Refresh now" title="Refresh now">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="notify" class="icon-btn" type="button" aria-pressed="false" aria-label="Score alerts off" title="Score alerts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <button id="open-settings" class="icon-btn" type="button" aria-label="Settings: data saver, data used, theme" title="Settings" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="17" r="2.4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <a role="tab" href="#home" data-tab="home"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 4l8.5 6.5V20H15v-5.5H9V20H3.5z"/></g></svg><span>Home</span></a>
    <a role="tab" href="#penguins" data-tab="penguins"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="9.5" rx="8" ry="3.5"/><path d="M4 9.5v4c0 1.9 3.6 3.5 8 3.5s8-1.6 8-3.5v-4"/></g></svg><span>Penguins</span></a>
    <a role="tab" href="#pirates" data-tab="pirates"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M7.2 5.6c2.1 3.6 2.1 9.2 0 12.8M16.8 5.6c-2.1 3.6-2.1 9.2 0 12.8"/></g></svg><span>Pirates</span></a>
    <a role="tab" href="#steelers" data-tab="steelers"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9.5" ry="5.5" transform="rotate(-40 12 12)"/><path d="M9.6 14.4l4.8-4.8M10.8 11.2l1.6 1.6M12.4 9.6l1.6 1.6"/></g></svg><span>Steelers</span></a>
    <a role="tab" href="#calendar" data-tab="calendar"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4M8 13.5h2M14 13.5h2M8 16.5h2"/></g></svg><span>Calendar</span></a>
    <a role="tab" href="#playoffs" data-tab="playoffs"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5.5a2.5 2.5 0 0 0 2.6 3.5M16 6h2.5a2.5 2.5 0 0 1-2.6 3.5M12 13v3.5M8.5 20h7M9.5 16.5h5"/></g></svg><span>Playoffs</span></a>
  </nav>
  </div>

  <div id="ptr" class="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div id="notice" class="notice" role="status" hidden></div>
  <div id="install" class="notice install" hidden></div>

  <main id="view" tabindex="-1"></main>

  <dialog id="settings" class="sheet" aria-label="Settings"></dialog>

  <footer class="footer">
    Scores and stats from ESPN, the NHL and MLB public APIs. Not affiliated with any team or league.
  </footer>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/odds.js"></script>
  <script src="js/views-team.js"></script>
  <script src="js/views-game.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/playoffs.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
